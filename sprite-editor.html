<title>ComicCore — Sprite Studio</title>
<script>
// One-time cleanup: drop any old service worker (whatever its filename) and its caches,
// so stale copies of this page can't be served. Reloads at most once per session.
(async () => {
  try {
    let cleaned = false;
    if ('serviceWorker' in navigator) {
      for (const r of await navigator.serviceWorker.getRegistrations()) { await r.unregister(); cleaned = true; }
    }
    if ('caches' in window) {
      for (const k of await caches.keys()) { await caches.delete(k); cleaned = true; }
    }
    if (cleaned && !sessionStorage.getItem('cc-sw-cleaned')) {
      sessionStorage.setItem('cc-sw-cleaned', '1');
      location.reload();
    }
  } catch (e) {}
})();
</script>

<style>
:root { --bg: #d9d9de; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  height: 100dvh;
  display: flex; align-items: center; justify-content: center;
}
/* Fills the screen, but never scales past the image's own 2048x2048 size */
#construction {
  display: block;
  width: auto; height: auto;
  max-width: 100vw; max-height: 100dvh;
  object-fit: contain;
  -webkit-user-drag: none; user-select: none;
}

/* Back button: same size, shape, icon and hover as Discover's, recolored for the light background */
.icon-btn {
  position: fixed; z-index: 10;
  top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px;
  width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
  background: rgba(0,0,0,.07); border: 1px solid rgba(0,0,0,.12); color: #0a0a0c;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 15px; transition: all 0.18s; text-decoration: none; padding: 0;
}
.icon-btn:hover { background: rgba(0,0,0,.12); color: #ff7a00; transform: translateY(-1px); }
@media (min-width: 900px) { .icon-btn { left: 32px; } }
</style>
