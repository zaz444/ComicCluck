<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ComicCore — Sprite Editor</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff7a00">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root { --bg: #d9d9de; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  height: 100dvh;
  display: flex; align-items: center; justify-content: center;
}
/* stop sign */
#construction {
  display: block;
  width: auto; height: auto;
  max-width: 100vw; max-height: 100dvh;
  object-fit: contain;
  -webkit-user-drag: none; user-select: none;
}
</style>
</head>
<body>
<img id="construction" alt="STOP! This page is currently under construction" src="https://mmycqeejhguzhtzkyjaj.supabase.co/storage/v1/object/public/comiccore-assets/buttons/Untitled173_20261025203151.png">
</body>
</html>
